[project]
name = "ann-workbook"
version = "0.1.0"
description = "A collection of CNN learning notebooks (PyTorch) — runs locally with uv and in Google Colab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=2",
    "pandas>=2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
    "kagglehub>=1.0",
]

[dependency-groups]
dev = [
    "jupyter",
    "ipykernel",
    "torchinfo>=1.8",
]
